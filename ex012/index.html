<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos em Site</title>
    <link rel="shortcut icon" href="icons/favicon-html5-2.png" type="image/x-icon">
</head>
<body>
    <h1>Colocando vídeos em seu site</h1>
    <h2>Primeiro vídeo</h2>
    <p>Exemplo:</p>
        <video width="560" poster="imagens/banner-video.jpg" loop controls >
            <source src="midia/video-ilustrativo.webm.webm" type="video/webm">
            <source src="midia/video-ilustrativo.wmv.wmv" type="video/wmv">
            <source src="midia/video-ilustrativo.mp4.mp4" type="video/mp4">
            <p>Seu navegador não é comptatível com reprodução de vídeos</p>
        </video>
    <h1>Incorporando vídeos meus no Youtube</h1>
    <p>Este é o meu ultimo vídeo:</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/KB-NFPEaqT4?si=4nV4hDogjr33EIVf&amp;start=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
